}).addTo(map);

const allBounds = [];
const groupLayers = {};
const matriculasLayer = L.layerGroup();

REGISTRY.forEach(function(feat) {
  const cor = CORES[feat.grupo] || '#888888';
  const latlngs = feat.polygons.map(function(ring) {
    return [ ring.map(function(pt) { return [pt[1], pt[0]]; }) ];
  });

  const poly = L.polygon(latlngs, {
    color: cor,
    weight: 2.5,
    fillColor: cor,
    fillOpacity: 0.35,
    opacity: 0.95
  });

  const tooltipHtml = '<b>' + feat.proprietario + '</b><br>Matrícula: ' + feat.matricula +
                       '<br><span style="color:#555">' + feat.nome + '</span>';
  poly.bindTooltip(tooltipHtml, { sticky: true, className: 'mat-tooltip' });

  const popupHtml = '<div style="max-width:260px;">' +
                     '<b>Matrícula ' + feat.matricula + '</b><br>' +
                     '<b>Propriet&aacute;rio:</b> ' + feat.proprietario + '<br>' +
                     '<b>Im&oacute;vel:</b> ' + feat.nome + '<br>' +
                     '<b>Grupo:</b> ' + feat.grupo +
                     '</div>';
  poly.bindPopup(popupHtml, { maxWidth: 300 });

  poly.on('mouseover', function() { poly.setStyle({ fillOpacity: 0.55, weight: 4 }); });
  poly.on('mouseout', function() { poly.setStyle({ fillOpacity: 0.35, weight: 2.5 }); });

  poly.addTo(matriculasLayer);

  feat.polygons.forEach(function(ring) {
    ring.forEach(function(pt) { allBounds.push([pt[1], pt[0]]); });
  });

  if (!groupLayers[feat.grupo]) groupLayers[feat.grupo] = [];
  groupLayers[feat.grupo].push(poly);
});

matriculasLayer.addTo(map);

  map.fitBounds(allBounds, { padding: [30,30] });
} else {

      weight: 2,
      fillColor: COR_AMARRACAO,
      fillOpacity: 0.95
    });
    marker.bindTooltip('<b>' + feat.name + '</b>', { sticky: true, className: 'mat-tooltip' });
    marker.bindPopup(popupAmarracao(feat), { maxWidth: 340 });
    marker.addTo(amarracaoLayer);
  } else if (feat.type === 'line') {
    const latlngs = feat.coords.map(function(pt) { return [pt[1], pt[0]]; });
    const line = L.polyline(latlngs, {
      color: COR_AMARRACAO,
      weight: 3,
      dashArray: '6 6',
      opacity: 0.9
    });
    line.bindTooltip('<b>' + feat.name + '</b>', { sticky: true, className: 'mat-tooltip' });
    line.bindPopup(popupAmarracao(feat), { maxWidth: 340 });
    line.on('mouseover', function() { line.setStyle({ weight: 5 }); });
    line.on('mouseout', function() { line.setStyle({ weight: 3 }); });
    line.addTo(amarracaoLayer);
  }
});

amarracaoLayer.addTo(map);

// --- Camada de municipios (fundo, transparente) ---
const municipiosLayer = L.geoJSON(MUNICIPIOS_GEOJSON, {
  pane: 'municipiosPane',
  style: function() {
    return { color: '#dddddd', weight: 1, opacity: 0.55, fillColor: '#ffffff', fillOpacity: 0.05 };
  },
  onEachFeature: function(feature, layer) {
    layer.bindTooltip(feature.properties.nome, {
      permanent: true, direction: 'center', className: 'label-plain muni-label'
    });
    layer.on('mouseover', function() { layer.setStyle({ fillOpacity: 0.18, weight: 2 }); });
    layer.on('mouseout', function() { layer.setStyle({ fillOpacity: 0.05, weight: 1 }); });
  }
});
municipiosLayer.addTo(map);

// --- Camada de limites estaduais ---
const estadosLayer = L.geoJSON(ESTADOS_GEOJSON, {
  pane: 'estadosPane',
  style: function(feature) {
    const destaque = feature.properties.nome === UF_DESTAQUE;
    return {
      color: destaque ? '#ffeb3b' : '#9e9e9e',
      weight: destaque ? 2.5 : 1.8,
      opacity: 0.85,
      dashArray: '9 5',
      fill: false
    };
  },
  onEachFeature: function(feature, layer) {
    layer.bindTooltip('Estado: <b>' + feature.properties.nome + '</b>', { sticky: true, className: 'mat-tooltip' });
  }
});
estadosLayer.addTo(map);

// --- Camada de rodovias principais ---
const rodoviasLayer = L.layerGroup();
const CORES_RODOVIA = { trunk: '#ff5722', primary: '#ffc107', secondary: '#fff59d' };
const PESOS_RODOVIA = { trunk: 3.5, primary: 2.5, secondary: 1.5 };

RODOVIAS.forEach(function(r) {
  const latlngs = r.lines.map(function(line) { return line.map(function(pt) { return [pt[1], pt[0]]; }); });
  const cor = CORES_RODOVIA[r.classe] || '#ffffff';
  const peso = PESOS_RODOVIA[r.classe] || 1.5;
  const line = L.polyline(latlngs, {
    pane: 'rodoviasPane',
    color: cor,
    weight: peso,
    opacity: 0.85
  });
  line.bindPopup('<b>Rodovia ' + r.ref + '</b><br>Classifica&ccedil;&atilde;o: ' + r.classe);
  line.on('mouseover', function() { line.setStyle({ weight: peso + 2 }); });
  line.on('mouseout', function() { line.setStyle({ weight: peso }); });
  line.addTo(rodoviasLayer);

  if (r.label_point) {
    const lbl = L.marker([r.label_point[1], r.label_point[0]], {
      pane: 'rodoviasPane',
      icon: L.divIcon({ className: '', html: '', iconSize: [0,0] }),
      interactive: false
    });
    lbl.bindTooltip(r.ref, {
      permanent: true, direction: 'center',
      className: 'label-plain road-label rl-' + r.classe
    });
    lbl.addTo(rodoviasLayer);
  }
});
rodoviasLayer.addTo(map);

// --- Camada de cidades / sedes municipais ---
const cidadesLayer = L.layerGroup();
CIDADES.forEach(function(c) {
  const destaque = c.tipo === 'sede_regiao';
  const marker = L.circleMarker([c.lat, c.lon], {
    pane: 'cidadesPane',
    radius: destaque ? 6 : 4,
    color: '#222222',
    weight: 1.5,
    fillColor: destaque ? '#ffffff' : '#bdbdbd',
    fillOpacity: 1
  });
  marker.bindTooltip(c.nome, {
    permanent: true, direction: 'right', offset: [8, 0],
    className: 'label-plain city-label' + (destaque ? '' : '')
  });
  marker.addTo(cidadesLayer);
});
cidadesLayer.addTo(map);

const IS_MOBILE = window.matchMedia('(max-width: 700px)').matches;

function buildCollapsible(div, titleText, bodyHtml, startCollapsed) {
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = titleText + '<span class="toggle-arrow">' + (startCollapsed ? '▸' : '▾') + '</span>';
  const body = document.createElement('div');
  body.innerHTML = bodyHtml;
  body.style.display = startCollapsed ? 'none' : 'block';
  header.onclick = function() {
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? 'block' : 'none';
    header.querySelector('.toggle-arrow').textContent = hidden ? '▾' : '▸';
  };
  div.appendChild(header);
  div.appendChild(body);
}

L.control.layers(null, {
  'Matrículas (polígonos)': matriculasLayer,
  'Amarração Mat. 456/471/482 (referência)': amarracaoLayer,
  'Cidades e sedes municipais': cidadesLayer,
  'Rodovias principais': rodoviasLayer,
  'Limites municipais (BA)': municipiosLayer,
  'Limites estaduais': estadosLayer
}, { collapsed: IS_MOBILE, position: 'topleft' }).addTo(map);

const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  let body = '';
  Object.keys(CORES).forEach(function(grupo) {
    const n = (groupLayers[grupo] || []).length;
    body += '<div><span class="swatch" style="background:' + CORES[grupo] + '"></span>' + grupo + ' (' + n + ')</div>';
  });
  body += '<div style="margin-top:6px; border-top:1px solid #ccc; padding-top:6px;">' +
          '<span class="swatch" style="background:' + COR_AMARRACAO + '"></span>Amarração Mat. 456/471/482 (' + AMARRACAO.length + ')</div>';
  body += '<div style="margin-top:8px; border-top:1px solid #ccc; padding-top:6px; font-size:11.5px; color:#444;">' +
          '<div><span class="swatch" style="background:#ffeb3b; border-color:#999;"></span>Limite da Bahia</div>' +
          '<div><span class="swatch" style="background:#ffffff; border:1px dashed #999;"></span>Municípios (BA)</div>' +
          '<div><span class="swatch" style="background:#ff5722;"></span>Rodovia federal (BR)</div>' +
          '<div><span class="swatch" style="background:#ffc107;"></span>Rodovia estadual (princ.)</div>' +
          '<div><span class="swatch" style="background:#ffffff; border-color:#222;"></span>Sede municipal</div>' +
          '</div>';
  buildCollapsible(div, 'Matrículas bloqueadas', body, IS_MOBILE);
  return div;
};
legend.addTo(map);

const info = L.control({ position: 'topright' });
info.onAdd = function() {
  const div = L.DomUtil.create('div', 'info-box');
  const body = '<b>Processo 8000798-28.2022.8.05.0068</b><br>' +
               'Passe o mouse sobre um pol&iacute;gono para ver propriet&aacute;rio e matr&iacute;cula.<br>' +
               'Clique no pol&iacute;gono para ver os detalhes (propriet&aacute;rio, matr&iacute;cula, im&oacute;vel).<br>' +
               '<span style="color:#00838f">Linhas tracejadas ciano</span>: refer&ecirc;ncia de amarra&ccedil;&atilde;o das Mat. 456/471/482 (clique para detalhes).<br>' +
               'Use o painel &agrave; esquerda para ligar/desligar limites estaduais, munic&iacute;pios, rodovias e cidades.';
  buildCollapsible(div, 'ℹ️ Sobre o mapa', body, IS_MOBILE);
  return div;
};
info.addTo(map);
</script>
</body>
</html>
